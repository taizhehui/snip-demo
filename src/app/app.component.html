<main class="wrap">
  <h1>Snip</h1>
  <p class="sub">Paste a link, get a short one.</p>

  <form class="form" (ngSubmit)="submit()">
    <input
      type="text"
      name="url"
      placeholder="https://example.com/very/long/link"
      [ngModel]="url()"
      (ngModelChange)="url.set($event)"
      autocomplete="off"
    />
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Shortening…' : 'Shorten' }}
    </button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (created(); as link) {
    <p class="success">
      Short link:
      <a [href]="link.shortUrl" target="_blank" rel="noopener">{{ link.shortUrl }}</a>
    </p>
  }

  <table class="links">
    <thead>
      <tr>
        <th>Code</th>
        <th>Original URL</th>
        <th>Hits</th>
      </tr>
    </thead>
    <tbody>
      @for (item of items(); track item.code) {
        <tr>
          <td>
            <a [href]="item.shortUrl" target="_blank" rel="noopener">{{ item.code }}</a>
          </td>
          <td class="url">{{ item.url }}</td>
          <td>{{ item.hits }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="empty">No links yet.</td>
        </tr>
      }
    </tbody>
  </table>
</main>
